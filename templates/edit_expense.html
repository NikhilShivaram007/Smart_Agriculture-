<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense | Smart Agriculture</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8f4;
            color: #333;
        }

        .header {
            background: #176b35;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .header a {
            color: white;
            text-decoration: none;
            background: #0f5428;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .header a:hover {
            background: #0b3f1e;
        }

        .container {
            width: 92%;
            max-width: 700px;
            margin: 35px auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #176b35;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #176b35;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .update-button {
            flex: 1;
            border: none;
            background: #176b35;
            color: white;
            padding: 13px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .update-button:hover {
            background: #0f5428;
        }

        .cancel-button {
            flex: 1;
            text-align: center;
            text-decoration: none;
            background: #777;
            color: white;
            padding: 13px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
        }

        .cancel-button:hover {
            background: #555;
        }

    </style>

</head>

<body>

    <header class="header">

        <h1>🌾 Smart Agriculture</h1>

        <a href="{{ url_for('expense_management') }}">
            ← Expenses
        </a>

    </header>


    <div class="container">

        <div class="card">

            <h2>✏️ Edit Expense</h2>


            <form method="POST"
                  action="{{ url_for('edit_expense', expense_id=expense['id']) }}">


                <!-- Expense Category -->

                <div class="form-group">

                    <label for="category">
                        Expense Category
                    </label>

                    <select
                        id="category"
                        name="category"
                        required>

                        <option value="Seeds"
                        {% if expense['category'] == 'Seeds' %}selected{% endif %}>
                            🌱 Seeds
                        </option>

                        <option value="Fertilizer"
                        {% if expense['category'] == 'Fertilizer' %}selected{% endif %}>
                            🌿 Fertilizer
                        </option>

                        <option value="Pesticides"
                        {% if expense['category'] == 'Pesticides' %}selected{% endif %}>
                            🧪 Pesticides
                        </option>

                        <option value="Labour"
                        {% if expense['category'] == 'Labour' %}selected{% endif %}>
                            👨‍🌾 Labour
                        </option>

                        <option value="Irrigation"
                        {% if expense['category'] == 'Irrigation' %}selected{% endif %}>
                            💧 Irrigation
                        </option>

                        <option value="Equipment"
                        {% if expense['category'] == 'Equipment' %}selected{% endif %}>
                            🚜 Equipment
                        </option>

                        <option value="Fuel / Diesel"
                        {% if expense['category'] == 'Fuel / Diesel' %}selected{% endif %}>
                            ⛽ Fuel / Diesel
                        </option>

                        <option value="Electricity"
                        {% if expense['category'] == 'Electricity' %}selected{% endif %}>
                            ⚡ Electricity
                        </option>

                        <option value="Water"
                        {% if expense['category'] == 'Water' %}selected{% endif %}>
                            💧 Water
                        </option>

                        <option value="Machinery Repair"
                        {% if expense['category'] == 'Machinery Repair' %}selected{% endif %}>
                            🔧 Machinery Repair
                        </option>

                        <option value="Tractor"
                        {% if expense['category'] == 'Tractor' %}selected{% endif %}>
                            🚜 Tractor
                        </option>

                        <option value="Transport"
                        {% if expense['category'] == 'Transport' %}selected{% endif %}>
                            🚚 Transport
                        </option>

                        <option value="Land Preparation"
                        {% if expense['category'] == 'Land Preparation' %}selected{% endif %}>
                            🌾 Land Preparation
                        </option>

                        <option value="Harvesting"
                        {% if expense['category'] == 'Harvesting' %}selected{% endif %}>
                            🌾 Harvesting
                        </option>

                        <option value="Storage"
                        {% if expense['category'] == 'Storage' %}selected{% endif %}>
                            🏠 Storage
                        </option>

                        <option value="Packaging"
                        {% if expense['category'] == 'Packaging' %}selected{% endif %}>
                            📦 Packaging
                        </option>

                        <option value="Animal Feed"
                        {% if expense['category'] == 'Animal Feed' %}selected{% endif %}>
                            🐄 Animal Feed
                        </option>

                        <option value="Veterinary"
                        {% if expense['category'] == 'Veterinary' %}selected{% endif %}>
                            🩺 Veterinary
                        </option>

                        <option value="Farm Rent"
                        {% if expense['category'] == 'Farm Rent' %}selected{% endif %}>
                            🏡 Farm Rent
                        </option>

                        <option value="Land Rent"
                        {% if expense['category'] == 'Land Rent' %}selected{% endif %}>
                            🌱 Land Rent
                        </option>

                        <option value="Insurance"
                        {% if expense['category'] == 'Insurance' %}selected{% endif %}>
                            🛡️ Insurance
                        </option>

                        <option value="Loan / Interest"
                        {% if expense['category'] == 'Loan / Interest' %}selected{% endif %}>
                            💰 Loan / Interest
                        </option>

                        <option value="Mobile / Internet"
                        {% if expense['category'] == 'Mobile / Internet' %}selected{% endif %}>
                            📱 Mobile / Internet
                        </option>

                        <option value="Maintenance"
                        {% if expense['category'] == 'Maintenance' %}selected{% endif %}>
                            🛠️ Maintenance
                        </option>

                        <option value="Other"
                        {% if expense['category'] == 'Other' %}selected{% endif %}>
                            📦 Other
                        </option>

                    </select>

                </div>


                <!-- Amount -->

                <div class="form-group">

                    <label for="amount">
                        Expense Amount (₹)
                    </label>

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        min="0.01"
                        step="0.01"
                        value="{{ expense['amount'] }}"
                        required>

                </div>


                <!-- Date -->

                <div class="form-group">

                    <label for="expense_date">
                        Expense Date
                    </label>

                    <input
                        type="date"
                        id="expense_date"
                        name="expense_date"
                        value="{{ expense['expense_date'] }}"
                        required>

                </div>


                <!-- Crop -->

                <div class="form-group">

                    <label for="crop">
                        Crop
                    </label>

                    <input
                        type="text"
                        id="crop"
                        name="crop"
                        value="{{ expense['crop'] or '' }}"
                        placeholder="Example: Rice, Wheat, Tomato">

                </div>


                <!-- Payment Method -->

                <div class="form-group">

                    <label for="payment_method">
                        Payment Method
                    </label>

                    <select
                        id="payment_method"
                        name="payment_method">

                        <option value="Cash"
                        {% if expense['payment_method'] == 'Cash' %}selected{% endif %}>
                            💵 Cash
                        </option>

                        <option value="UPI"
                        {% if expense['payment_method'] == 'UPI' %}selected{% endif %}>
                            📱 UPI
                        </option>

                        <option value="Bank Transfer"
                        {% if expense['payment_method'] == 'Bank Transfer' %}selected{% endif %}>
                            🏦 Bank Transfer
                        </option>

                        <option value="Card"
                        {% if expense['payment_method'] == 'Card' %}selected{% endif %}>
                            💳 Card
                        </option>

                    </select>

                </div>


                <!-- Receipt Number -->

                <div class="form-group">

                    <label for="receipt_number">
                        Receipt Number
                    </label>

                    <input
                        type="text"
                        id="receipt_number"
                        name="receipt_number"
                        value="{{ expense['receipt_number'] or '' }}"
                        placeholder="Enter receipt number">

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label for="description">
                        Description / Notes
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Enter expense details">{{ expense['description'] or '' }}</textarea>

                </div>


                <!-- Buttons -->

                <div class="button-group">

                    <button
                        type="submit"
                        class="update-button">

                        💾 Update Expense

                    </button>


                    <a
                        href="{{ url_for('expense_management') }}"
                        class="cancel-button">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
