<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farm Waste | Smart Agriculture</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8f3;
            color: #333;
        }

        /* ================= TOP BAR ================= */

        .topbar {
            background: #176b35;
            color: white;

            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h2 {
            margin: 0;
        }

        .dashboard-btn {
            background: white;
            color: #176b35;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 6px;

            font-weight: bold;
        }

        .dashboard-btn:hover {
            background: #e8f5e9;
        }


        /* ================= CONTAINER ================= */

        .container {
            width: 90%;
            max-width: 1000px;

            margin: 40px auto;
        }


        .title {
            color: #176b35;

            margin-bottom: 25px;
        }


        /* ================= FORM CARD ================= */

        .form-card {
            background: white;

            padding: 30px;

            border-radius: 14px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);

            margin-bottom: 30px;
        }

        .form-card h3 {
            color: #176b35;

            margin-top: 0;

            margin-bottom: 20px;
        }


        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }


        select {
            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 8px;

            background: white;

            font-size: 15px;

            outline: none;
        }

        select:focus {
            border-color: #176b35;
        }


        /* ================= BUTTON ================= */

        .submit-btn {
            margin-top: 20px;

            padding: 13px 25px;

            border: none;

            border-radius: 8px;

            background: #176b35;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .submit-btn:hover {
            background: #0e5428;

            transform: translateY(-2px);
        }


        /* ================= RESULT SECTION ================= */

        .result-section {
            animation: resultAppear 0.8s ease;
        }


        @keyframes resultAppear {

            0% {
                opacity: 0;
                transform: translateY(30px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }

        }


        .success-message {
            background: #e8f5e9;

            border-left: 5px solid #176b35;

            padding: 15px;

            border-radius: 8px;

            color: #176b35;

            font-weight: bold;

            margin-bottom: 25px;
        }


        .result-title {
            color: #176b35;

            margin-bottom: 20px;
        }


        /* ================= USE CARDS ================= */

        .uses-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(210px, 1fr));

            gap: 20px;
        }


        .use-card {
            background: white;

            padding: 25px;

            border-radius: 14px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);

            text-align: center;

            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;

            animation: cardAppear 0.7s ease both;
        }


        .use-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .use-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .use-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .use-card:nth-child(4) {
            animation-delay: 0.4s;
        }

        .use-card:nth-child(5) {
            animation-delay: 0.5s;
        }

        .use-card:nth-child(6) {
            animation-delay: 0.6s;
        }


        @keyframes cardAppear {

            0% {
                opacity: 0;
                transform: scale(0.7) translateY(30px);
            }

            70% {
                transform: scale(1.05);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }

        }


        .use-card:hover {
            transform: translateY(-8px);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.13);
        }


        .use-icon {
            font-size: 40px;

            margin-bottom: 12px;

            display: block;
        }


        .use-card h3 {
            color: #176b35;

            margin: 5px 0 10px;

            font-size: 18px;
        }


        .use-card p {
            margin: 0;

            line-height: 1.5;

            color: #555;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .topbar {
                padding: 15px;
            }

            .container {
                width: 94%;
            }

            .form-card {
                padding: 20px;
            }

            .uses-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- ================= TOP BAR ================= -->

    <div class="topbar">

        <h2>
            🌾 SMART FARM
        </h2>

        <a
            href="/dashboard"
            class="dashboard-btn"
        >
            🏠 Dashboard
        </a>

    </div>



    <!-- ================= MAIN CONTENT ================= -->

    <div class="container">

        <h1 class="title">
            🌱 Farm Waste
        </h1>


        <!-- ================= FORM ================= -->

        <div class="form-card">

            <h3>
                ♻️ Add Farm Waste
            </h3>


            <form method="POST">


                <label for="waste_type">
                    Select Waste Type
                </label>


                <select
                    name="waste_type"
                    id="waste_type"
                    required
                >

                    <option value="">
                        Select Farm Waste
                    </option>


                    <option value="Rice Straw">
                        🌾 Rice Straw
                    </option>

                    <option value="Corn Stalk">
                        🌽 Corn Stalk
                    </option>

                    <option value="Wheat Straw">
                        🌾 Wheat Straw
                    </option>

                    <option value="Ragi Waste">
                        🌱 Ragi Waste
                    </option>

                    <option value="Banana Leaves">
                        🍌 Banana Leaves
                    </option>

                    <option value="Banana Stem">
                        🍌 Banana Stem
                    </option>

                    <option value="Coconut Shell">
                        🥥 Coconut Shell
                    </option>

                    <option value="Coconut Husk">
                        🥥 Coconut Husk
                    </option>

                    <option value="Sugarcane Bagasse">
                        🎋 Sugarcane Bagasse
                    </option>

                    <option value="Groundnut Shell">
                        🥜 Groundnut Shell
                    </option>

                    <option value="Pulses Waste">
                        🫘 Pulses Waste
                    </option>

                    <option value="Vegetable Waste">
                        🥬 Vegetable Waste
                    </option>

                    <option value="Fruit Waste">
                        🍎 Fruit Waste
                    </option>

                    <option value="Leaves">
                        🌿 Leaves
                    </option>

                    <option value="Weeds">
                        🌱 Weeds
                    </option>

                    <option value="Dry Grass">
                        🌾 Dry Grass
                    </option>

                    <option value="Cow Dung">
                        🐄 Cow Dung
                    </option>

                    <option value="Goat Manure">
                        🐐 Goat Manure
                    </option>

                    <option value="Poultry Waste">
                        🐔 Poultry Waste
                    </option>

                    <option value="Tree Branches">
                        🌳 Tree Branches
                    </option>

                    <option value="Tree Leaves">
                        🌳 Tree Leaves
                    </option>

                    <option value="Wood Waste">
                        🪵 Wood Waste
                    </option>

                    <option value="Potato Peels">
                        🥔 Potato Peels
                    </option>

                    <option value="Onion Peels">
                        🧅 Onion Peels
                    </option>

                    <option value="Tomato Waste">
                        🍅 Tomato Waste
                    </option>

                    <option value="Vegetable Crop Residue">
                        🌶️ Vegetable Crop Residue
                    </option>

                    <option value="Other Farm Waste">
                        ♻️ Other Farm Waste
                    </option>

                </select>


                <button
                    type="submit"
                    class="submit-btn"
                >
                    ♻️ Add Waste
                </button>

            </form>

        </div>



        <!-- ================= RESULT ================= -->

        {% if waste_type %}

        <div class="result-section">


            <div class="success-message">

                ✅ Farm waste added successfully!

            </div>


            <h2 class="result-title">

                {{ waste_emoji }} {{ waste_type }} — Useful Options

            </h2>


            <div class="uses-grid">


                {% for use in waste_uses %}

                <div class="use-card">

                    <span class="use-icon">
                        {{ use.icon }}
                    </span>

                    <h3>
                        {{ use.title }}
                    </h3>

                    <p>
                        {{ use.description }}
                    </p>

                </div>

                {% endfor %}


            </div>


        </div>

        {% endif %}


    </div>


</body>

</html>
